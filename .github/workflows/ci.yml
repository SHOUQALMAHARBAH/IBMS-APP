name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx turbo run typecheck --filter=web

      - name: Lint
        run: npx turbo run lint --filter=web

      - name: Unit/component tests
        run: npx turbo run test --filter=web

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Accessibility (axe-core)
        run: npx turbo run test:a11y --filter=web

      - name: E2E tests (Playwright)
        run: npx turbo run e2e --filter=web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000

      - name: Build
        run: npx turbo run build --filter=web

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  backend:
    runs-on: ubuntu-latest
    env:
      # Points at the ephemeral `postgres` service container below, NOT at any
      # persistent dev database — this container and its data are created fresh
      # per workflow run and destroyed with the runner when the job ends. Named
      # ibms_test (not the `ibms` name docker-compose.yml uses for local dev) so
      # a CI log or connection string can never be mistaken for the dev DB.
      DATABASE_URL: postgresql://ibms:ibms@localhost:5432/ibms_test?schema=public
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ibms
          POSTGRES_PASSWORD: ibms
          POSTGRES_DB: ibms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ibms"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx turbo run typecheck --filter=api...

      - name: Lint
        run: npx turbo run lint --filter=api...

      - name: Unit tests
        run: npx turbo run test --filter=api...

      - name: Security tests (dependency audit)
        run: npm run test:security

      - name: Create .env for CI (matches the postgres service above)
        run: cp .env.example .env

      - name: Create .env.test for CI
        # apps/api's test:e2e/test:contract scripts load .env.test via dotenv (see
        # apps/api/package.json), and those tasks run through `npx turbo run ...`,
        # which strips ambient env vars (including the DATABASE_URL set on this job)
        # from tasks that don't declare them in turbo.json. Without this file, dotenv
        # has nothing to restore and Prisma sees no DATABASE_URL at all. Point it at
        # this job's own postgres service (port 5432) — not port 5434, which is
        # docker-compose's local db-test container and doesn't exist here.
        run: |
          cat > .env.test <<'EOF'
          POSTGRES_USER=ibms
          POSTGRES_PASSWORD=ibms
          POSTGRES_DB=ibms_test
          DATABASE_URL=postgresql://ibms:ibms@localhost:5432/ibms_test?schema=public
          EOF

      - name: Database schema (prisma validate)
        run: npm run db:validate

      - name: Run Prisma migrations
        run: npm run db:migrate:deploy

      - name: Verify schema — migration history matches schema.prisma (no drift)
        run: npm run db:migrate:status

      - name: Integration tests
        run: npx turbo run test:e2e --filter=api...

      - name: Contract tests (OpenAPI)
        run: npx turbo run test:contract --filter=api...

      - name: Smoke tests
        run: bash scripts/smoke.sh api

      - name: Build
        run: npx turbo run build --filter=api...

  docker:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [api, web]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.app }} image (no push — deployment target is TBD)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: false
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
