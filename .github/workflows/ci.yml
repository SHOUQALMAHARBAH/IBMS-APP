name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # `false`, DELIBERATELY — changed 2026-10-15 after the hazard was measured rather than reasoned.
  #
  # `true` cancels the in-flight run when a newer commit is pushed to the same ref. On this project
  # that is not a saving, it is the deletion of evidence: the standing rule is that EVERY commit is
  # proved, not just the branch tip, and a cancelled run leaves the previous commit with no full
  # verification at all. It happened twice in one session — `8ce77bf` and `244fa27` each had their
  # only run destroyed by the next push — and the retention pair therefore reached a green tip
  # having never itself been proved.
  #
  # The alternative was to keep `true` and wait for `backend` before every push. That treats the
  # EFFECT and depends on remembering, which already failed twice; this repository's own opening
  # principle is to prefer the form that cannot express the mistake over the form that requires you
  # to notice it.
  #
  # The cost is runner compute on rapid pushes. This repository is PUBLIC, so Actions minutes are
  # free, and GitHub's free concurrency ceiling is far above a session's worth of commits. Paying
  # compute to keep the only proof a commit ever had is the right side of that trade.
  #
  # Reversible in one line if the concurrency ever becomes the problem.
  cancel-in-progress: false

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx turbo run typecheck --filter=web

      - name: Lint
        run: npx turbo run lint --filter=web

      # THE OWNER FOUND THIS CLASS BY CLICKING, ON A THURSDAY EVENING. She opened
      # /provider-register-office as the platform operator and got eight empty dropdowns: the page
      # returned 200, her permission to open it was correct, and a supporting GET was gated on an
      # OFFICE permission she does not hold and must not be given.
      #
      # No gate could see it. A page-load check passes (the page loads). A nav-reachability check
      # passes (the nav entry is right). The api e2e suite passes (each route is correctly gated when
      # asked about alone). So this step asks the only question that catches it: for every (role,
      # screen) pair the role can OPEN, does every route that screen calls resolve for that role?
      #
      # It runs against a DECLARED SET rather than a count, so it fails BY NAME on a new mismatch and
      # also on a declared one that no longer occurs - a baseline that cannot become a ceiling.
      # Before the frontend's own tests, deliberately: it needs no install beyond the checkout and it
      # names the defect in one line, so it should not wait behind a six-minute Playwright run.
      - name: Screen/route permission fit
        run: python scripts/measurements/screen-route-permission-fit.py --check

      # ITEM 8 - a screen must not discard the lists that DID resolve.
      #
      # The owner met this as eight empty dropdowns on /provider-register-office: one Promise.all,
      # one refused call, and seven reference lists that had arrived perfectly thrown away under a
      # sentence naming none of them. Eleven of thirteen screens had the same shape; all eleven are
      # converted, so the measurement is at zero - and a measurement at zero that nothing runs goes
      # back to eleven. No allow-list: a screen that genuinely needs all-or-nothing says so by
      # discriminating in its rejection path, which is what the detector reads.
      - name: No all-or-nothing screen loaders
        run: python scripts/measurements/all-or-nothing-loaders.py --check

      # DECISION 13 — a page-wide TEXT absence assertion can match an element the test is not
      # about, and did: a role-name loop on one notice matched a NAV LABEL and failed on a correct
      # tree. A flat ban is a red build across 54 files, so this RATCHETS the one dangerous shape
      # and fails in BOTH directions — above the budget (a new one shipped) and below it (the
      # budget must follow, or a ratchet becomes a ceiling).
      #
      # It reads the script's OWN output and exit code; the figure is not restated here. The
      # earlier version of that script printed a breakdown by scoping and not by shape, so the
      # number carrying the rule existed only in a report.
      - name: No new page-wide text absence assertions
        run: python scripts/measurements/page-wide-absence-assertions.py --check

      # DECISION 21 — a label says what a field is FOR, never what our column is called. The
      # hiding of displayed ids became a BUILD RULE rather than a backlog row, and this is the
      # half a script can police: it classifies each candidate by HOW the screens render it
      # (prompt / heading / dead), counts PROMPTS, and fails in both directions. The three
      # polymorphic `/audit-trail` fields are declared BY NAME inside it, not absorbed.
      - name: No label names a column instead of its purpose
        run: python scripts/measurements/identifier-labels.py --check

      - name: Unit/component tests
        run: npx turbo run test --filter=web

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Accessibility (axe-core)
        run: npx turbo run test:a11y --filter=web

      - name: E2E tests (Playwright)
        run: npx turbo run e2e --filter=web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000

      - name: Build
        run: npx turbo run build --filter=web

      - name: Security tests (dependency audit, web workspace)
        # This job audited nothing at all until 2026-10-11, which is why a web
        # dev dependency's advisory surfaced on `backend` instead. LAST in the
        # job on purpose: an audit reads only the lockfile, so it needs nothing
        # above it, and placed here it can neither hide a gate nor be hidden by
        # one -- with `!cancelled()` so a red step above still lets it report.
        if: ${{ !cancelled() }}
        run: npm run test:security -- --workspace web

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  backend:
    runs-on: ubuntu-latest
    env:
      # Points at the ephemeral `postgres` service container below, NOT at any
      # persistent dev database — this container and its data are created fresh
      # per workflow run and destroyed with the runner when the job ends. Named
      # ibms_test (not the `ibms` name docker-compose.yml uses for local dev) so
      # a CI log or connection string can never be mistaken for the dev DB.
      DATABASE_URL: postgresql://ibms:ibms@localhost:5432/ibms_test?schema=public
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ibms
          POSTGRES_PASSWORD: ibms
          POSTGRES_DB: ibms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ibms"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx turbo run typecheck --filter=api...

      - name: Lint
        run: npx turbo run lint --filter=api...

      - name: Unit tests
        run: npx turbo run test --filter=api...

      - name: Security tests (dependency audit, api workspace)
        # SCOPED, because this job is named `backend`. Unfiltered, it audited the
        # whole monorepo, so a front-end-only dev advisory failed a check that
        # does not own it -- measured on 2026-10-11, when `braces` (reached only
        # through `eslint-config-next`) was the sole thing failing `backend`.
        # The web half is audited by the `frontend` job.
        run: npm run test:security -- --workspace api

      # `if: ${{ !cancelled() }}` from here to the end of the job.
      #
      # WHY IT COVERS THE SETUP AND NOT ONLY THE TESTS. It was added to the three test steps first, so that a
      # red lint or unit gate could no longer hide the integration suite — the failure mode that let the api
      # e2e suite stop running for three commits behind a newer red. Applied only there, it made things worse
      # in a different way: when the unit tests failed, every step between them and the tests was SKIPPED, so
      # the seed and the suites ran against a database with no schema and reported three extra failures that
      # were consequences of a skipped migration rather than defects. One real failure read as four.
      #
      # So the condition follows the dependency: if the tests are going to run after an earlier failure, the
      # database they need has to be set up too. Named step by step below rather than applied to the whole
      # job, so a future step does not inherit a condition nobody chose for it.
      - name: Create .env for CI (matches the postgres service above)
        if: ${{ !cancelled() }}
        run: cp .env.example .env

      - name: Create .env.test for CI
        if: ${{ !cancelled() }}
        # apps/api's test:e2e/test:contract scripts load .env.test via dotenv (see
        # apps/api/package.json), and those tasks run through `npx turbo run ...`,
        # which strips ambient env vars (including the DATABASE_URL set on this job)
        # from tasks that don't declare them in turbo.json. Without this file, dotenv
        # has nothing to restore and Prisma sees no DATABASE_URL at all. Point it at
        # this job's own postgres service (port 5432) — not port 5434, which is
        # docker-compose's local db-test container and doesn't exist here.
        run: |
          cat > .env.test <<'EOF'
          POSTGRES_USER=ibms
          POSTGRES_PASSWORD=ibms
          POSTGRES_DB=ibms_test
          DATABASE_URL=postgresql://ibms:ibms@localhost:5432/ibms_test?schema=public
          APP_DATABASE_URL=postgresql://ibms_app:ci-only-app-role@localhost:5432/ibms_test?schema=public
          JWT_ACCESS_SECRET=ci-only-change-me-32-characters-minimum
          MFA_ENCRYPTION_KEY=jWvaaenpb1O7k9jMlLZhRTeQFNJ1jQOFTUHtzgTHNtg=
          PII_ENCRYPTION_KEYS=v1:DzVvLT8z/wNB6UZW2cglf0EEajI/+hjMXk8WlVfHphI=
          PII_ENCRYPTION_ACTIVE_KEY_ID=v1
          ENABLE_DEV_RESET_TOKEN=true
          SCHEDULED_JOBS=disabled
          EOF

      # EVERY PER-ORGANIZATION SEED SWEEP MUST BE CLEARED BY THE FIXTURE CASCADE HELPER.
      #
      # The seed has functions that walk `organization.findMany()` and write a row into every
      # organization. A disposable e2e fixture organization is one of those rows, and every FK
      # involved is RESTRICT — so one seed run after a leak makes that fixture PERMANENTLY
      # undeletable and takes down every later spec at `createTestApp` with a fault that looks like
      # its own. This job went red exactly that way on `9da34f1`, with eleven leaked organizations.
      #
      # It is a DERIVATION, not a list: it reads the sweeps out of `seed.ts` and the cleared models
      # out of `tenant-prisma.ts`. A hand-kept list would have passed the very commit that motivated
      # it — that commit's own comment listed "branches, departments and holidays", which is two
      # sweeps counted as three models, and missed the licence sweep entirely.
      #
      # Placed BEFORE the migrations and the e2e run deliberately: it reads source, needs no
      # database, and a cheap refusal belongs ahead of a twenty-minute suite.
      - name: Every per-organization seed sweep is cleared by the fixture cascade
        run: python scripts/measurements/seed-sweeps-vs-cascade.py --check

      # ITEM B — A MEASUREMENT NOBODY RUNS IS A MEASUREMENT THAT IS ALREADY WRONG, and this one
      # proved it: it had been exiting 1 on `assert pairs == 15` against a registry holding sixteen,
      # before measuring anything, and nothing was red because nothing ran it.
      #
      # The count is DERIVED now — the registry's `dbCheckConstraint` values against the
      # `*_maker_checker_distinct` CHECK constraints the migrations create, by name and in both
      # directions — so a seventeenth pair moves both sides together and this stays quiet, while a
      # pair registered without its constraint, or a constraint no entry claims, fails by name.
      #
      # Running it does the ordinary report too, which is how the one pair WRITING the act and
      # showing nobody was found the moment the script could run at all.
      #
      # Beside the sweep gate and for the same reason: it reads source, needs no database, and a
      # cheap refusal belongs ahead of a twenty-minute suite.
      - name: Every maker/checker pair is registered, constrained, and shows its act on the record
        if: ${{ !cancelled() }}
        run: npm run check:maker-checker-pairs

      - name: Database schema (prisma validate)
        if: ${{ !cancelled() }}
        run: npm run db:validate

      # Part G checklist: `prisma format` has to actually RUN, not just be
      # available. It rewrites in place and has no --check, so the proof that
      # the committed schema is already formatted is that running it changes
      # nothing.
      - name: Database schema (prisma format leaves no diff)
        if: ${{ !cancelled() }}
        run: |
          npm run db:format
          git diff --exit-code -- packages/db/prisma/schema.prisma

      # Must precede the migrations: 20260928100000_row_level_security GRANTs to
      # this role and raises if it is missing. The role is what makes RLS apply
      # at all — Postgres exempts the table owner from its own policies, so CI
      # has to exercise the same non-owner connection production uses, or the
      # isolation tests would pass against policies that are silently inert.
      - name: Provision the non-owner application database role
        if: ${{ !cancelled() }}
        run: npm run db:provision-app-role
        env:
          APP_DB_PASSWORD: ci-only-app-role

      - name: Run Prisma migrations
        if: ${{ !cancelled() }}
        run: npm run db:migrate:deploy

      # This step was called "migration history matches schema.prisma (no drift)". It did neither:
      # `migrate status` compares the migration history against the DATABASE and never reads
      # schema.prisma, and it does not compare checksums — measured, with a drifted migration
      # present it printed "Database schema is up to date!" and exited 0. The three properties are
      # now three steps, each named for what it actually checks.
      - name: Verify migrations — every migration is applied
        if: ${{ !cancelled() }}
        run: npm run db:migrate:status

      - name: Verify migrations — no applied migration's file has been edited
        if: ${{ !cancelled() }}
        run: npm run db:checksums

      - name: Verify schema — schema.prisma still describes what the database enforces
        if: ${{ !cancelled() }}
        run: npm run db:divergence

      - name: Verify privileges — the runtime role cannot read past row-level security
        if: ${{ !cancelled() }}
        run: npm run db:privileges

      # `!cancelled()` so a failed VERIFICATION step above cannot hide this one.
      # Measured: `db:divergence` went red on 395a0a3 over an undeclared index and short-circuited the
      # job for three commits — during which the api e2e suite did not run at all, and a real e2e
      # failure it had already caught twice (permission-only-gates, four wrong route gates) disappeared
      # behind the newer red. The job still FAILS; it just stops being a one-signal job.
      - name: Seed database (roles + permission grid)
        if: ${{ !cancelled() }}
        run: npm run db:seed

      - name: Install Chromium for PdfRendererService (Part F item #7)
        # `!cancelled()` for the same reason as the seed step above, and it was MISSING here while
        # every neighbouring step had it — which is not a symmetry point but a measured defect.
        #
        # On decbcad the dependency-audit step went red, so this step SKIPPED while "Integration
        # tests" still ran (it has the guard). The suite then reported three failures —
        #   browserType.launch: Executable doesn't exist at .../chromium_headless_shell-1234/...
        # — on the invoice, policy-schedule-summary and certificate-of-insurance PDF tests. All three
        # were a CASCADE from an unrelated advisory, and all three passed locally, so the red named
        # three document tests and the actual cause was a dependency bump.
        #
        # That is exactly the failure mode the comment on the seed step describes, one step along: a
        # red gate changing what a LATER gate reports rather than merely stopping the job.
        if: ${{ !cancelled() }}
        run: npx playwright-core install --with-deps chromium

      # `!cancelled()` for the reason given on the seed step above.
      - name: Integration tests
        if: ${{ !cancelled() }}
        run: npx turbo run test:e2e --filter=api...

      # `!cancelled()` for the reason given on the seed step above.
      - name: Contract tests (OpenAPI)
        if: ${{ !cancelled() }}
        run: npx turbo run test:contract --filter=api...

      - name: Smoke tests
        run: bash scripts/smoke.sh api

      - name: Build
        run: npx turbo run build --filter=api...

      # A.10 (Part 10.4/10.5) — DAST, the counterpart to codeql.yml's SAST.
      # Boots the real built service (not a mock) against the same ephemeral
      # postgres this job already migrated/seeded, same "boot the real
      # thing" approach as the Smoke tests step above.
      #
      # Through dotenv and .env.test, for the same reason scripts/smoke.sh
      # sources that file: multi-tenancy Phase 2 runs the API on a NON-OWNER
      # role so row-level security applies to it, and PrismaService reads that
      # connection from APP_DATABASE_URL. This job never sets it, and the
      # `cp .env.example .env` step above leaves a root .env carrying the
      # placeholder `ibms_app:CHANGE_ME@localhost:5433` — docker-compose's
      # local dev port, which does not exist on a runner. @nestjs/config fills
      # gaps only, so DATABASE_URL kept this job's value while APP_DATABASE_URL
      # silently took the placeholder and the boot died on connect.
      #
      # .env.test already holds the correct CI value, and the Smoke step above
      # proves a real boot works from it. Reading the same file here means the
      # two boots cannot drift apart again — which is exactly what setting the
      # variable inline on this step would have invited.
      - name: Start API for DAST scan
        working-directory: apps/api
        run: |
          # Job control on, so the background job leads its own process group:
          # `npx dotenv -- node` makes the API a GRANDCHILD, and $! is npx. The
          # teardown below kills the group, not just that wrapper — the same
          # reason apps/api/scripts/smoke.sh sets this.
          set -m
          npx dotenv -e ../../.env.test -- node dist/src/main.js >/tmp/ibms-api-dast.log 2>&1 &
          echo $! > /tmp/ibms-api-dast.pid
          for _ in $(seq 1 30); do
            if curl -sf http://localhost:4000/health >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          echo "DAST: API never became healthy" >&2
          cat /tmp/ibms-api-dast.log >&2
          exit 1

      - name: DAST — OWASP ZAP baseline scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: "http://localhost:4000"
          # Baseline is passive-only (no active exploit attempts) — safe to
          # run against a live service in CI. `-I` and fail_action: false
          # make this informational-only for now (see README § Known gaps,
          # A.10): failing the whole pipeline on ZAP's default ruleset
          # before any real business endpoint exists would be noise, not
          # signal. Revisit once there's a documented allowlist for
          # accepted alerts. allow_issue_writing: false — this job's
          # GITHUB_TOKEN has no issues:write permission (default token
          # permissions on this repo are read-only), and a GitHub issue
          # filed on every PR run isn't what "informational" means here;
          # the scan output already lands in the job log.
          cmd_options: "-I"
          fail_action: false
          allow_issue_writing: false

      - name: Stop API (DAST)
        if: always()
        # The whole process group (see `set -m` above), falling back to the bare
        # pid so this still works if the group is gone.
        run: |
          pid="$(cat /tmp/ibms-api-dast.pid 2>/dev/null || true)"
          [ -n "$pid" ] || exit 0
          kill -- "-${pid}" 2>/dev/null || kill "$pid" 2>/dev/null || true

  docker:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [api, web]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.app }} image (no push — deployment target is TBD)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: false
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
