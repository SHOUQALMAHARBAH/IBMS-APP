name: Backup restore drill

# A.10 (Part 10.4/10.5) — "Encrypted, scheduled backups + actually-tested
# restore drills" and "Document and test RPO/RTO at least annually." Weekly
# is deliberately more often than the annual minimum the backlog item asks
# for — see ibms-brain/meta/lex/backup-rpo-rto.md for why.
#
# Uses docker-compose's db-test service directly (not a GitHub Actions
# `services:` container) because scripts/backup-restore-drill.sh drives it
# via `docker compose exec` — the same container the local dev/CI-verify
# flow already uses, so this drill is proving the same restore path a human
# running `bash scripts/backup-restore-drill.sh` locally would exercise.
on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch: {}

jobs:
  drill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # The seed imports `RoleName` from the GENERATED client, and nothing in
      # this job had ever generated it: `npm ci` runs no postinstall hook, and
      # unlike ci.yml this workflow runs no turbo task (turbo's graph builds
      # `@ibms/db` as a dependency, which is where ci.yml quietly gets its
      # client from). The seed therefore died on
      # `Cannot read properties of undefined (reading 'SALES_RELATIONSHIP_OFFICER')`
      # on every scheduled run since 2026-08-31.
      #
      # No `dotenv` wrapper and no DATABASE_URL: `prisma generate` only reads
      # the schema. Going through `npm run db:generate` would NOT work here —
      # that script is `dotenv -e ../../.env`, and this workflow only ever
      # writes `.env.test`.
      - name: Generate the Prisma client
        run: npx prisma generate --schema packages/db/prisma/schema.prisma

      - name: Create .env.test
        run: |
          cat > .env.test <<'EOF'
          POSTGRES_USER=ibms
          POSTGRES_PASSWORD=ibms
          POSTGRES_DB=ibms_test
          DATABASE_URL=postgresql://ibms:ibms@localhost:5434/ibms_test?schema=public
          JWT_ACCESS_SECRET=ci-only-change-me-32-characters-minimum
          MFA_ENCRYPTION_KEY=jWvaaenpb1O7k9jMlLZhRTeQFNJ1jQOFTUHtzgTHNtg=
          PII_ENCRYPTION_KEYS=v1:DzVvLT8z/wNB6UZW2cglf0EEajI/+hjMXk8WlVfHphI=
          PII_ENCRYPTION_ACTIVE_KEY_ID=v1
          ENABLE_DEV_RESET_TOKEN=true
          EOF

      - name: Start db-test
        run: |
          docker compose up -d db-test
          for _ in $(seq 1 30); do
            if docker compose exec -T db-test pg_isready -U ibms >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          echo "db-test never became healthy" >&2
          exit 1

      # Multi-tenancy Phase 2 — must precede the migrations, exactly as in
      # ci.yml's backend job: 20260928100000_row_level_security GRANTs to this
      # role and RAISEs if it is missing, because RLS is pointless without a
      # non-owner role for Postgres to apply it to.
      #
      # Through dotenv because this workflow has no job-level DATABASE_URL —
      # every database step here reads the .env.test written above (the db
      # workspace's own migrate:test:deploy/seed:test scripts do the same), and
      # provision-app-role.mjs takes its connection from DATABASE_URL.
      #
      # The role is cluster-level, not database-level, so it also still exists
      # when the drill restores the dump into its throwaway database — and
      # pg_dump emits this migration's `GRANT ... TO ibms_app` statements,
      # which would error on restore against a cluster that has never had it.
      - name: Provision the non-owner application database role
        run: npx dotenv -e .env.test -- npm run db:provision-app-role
        env:
          APP_DB_PASSWORD: ci-only-app-role

      - name: Run Prisma migrations (db-test)
        run: npm run db:test:migrate:deploy

      - name: Seed database (roles + permission grid)
        run: npm run db:test:seed

      # The drill encrypts its dump so it is never a plaintext file on disk
      # (Part 10.2/10.6), and `backup-restore-drill.sh` refuses to run without
      # a passphrase. That secret has never been set on this repository, so
      # even once the seed above is fixed this step would still have failed —
      # two stacked failures, not one.
      #
      # An EPHEMERAL per-run passphrase is the right one for this drill, not a
      # missing long-lived one. What the drill exists to prove is that the
      # round trip works — dump, encrypt, decrypt, restore, compare row counts,
      # inside the RTO target — against a throwaway database holding nothing
      # but the seeded role/permission grid. A repo secret would put a
      # long-lived credential into a job with no real data to protect, and it
      # still would not exercise the production key-management path, which
      # will not be a GitHub secret.
      #
      # Setting BACKUP_DRILL_ENCRYPTION_KEY still overrides this, for anyone
      # who wants the configured path exercised too.
      - name: Backup + restore drill
        env:
          CONFIGURED_PASSPHRASE: ${{ secrets.BACKUP_DRILL_ENCRYPTION_KEY }}
        run: |
          if [ -n "${CONFIGURED_PASSPHRASE:-}" ]; then
            echo "backup-drill: using the configured repository passphrase."
          else
            echo "backup-drill: no BACKUP_DRILL_ENCRYPTION_KEY set — using an ephemeral per-run passphrase."
            echo "backup-drill: the round trip is still proven; see ibms-brain/meta/lex/backup-rpo-rto.md."
            CONFIGURED_PASSPHRASE="$(openssl rand -base64 32)"
          fi
          BACKUP_ENCRYPTION_KEY="${CONFIGURED_PASSPHRASE}" \
            bash scripts/backup-restore-drill.sh
