services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ibms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ibms}
      POSTGRES_DB: ${POSTGRES_DB:-ibms}
    ports:
      # Host-side 5433, not 5432 — avoids clashing with a locally-installed
      # Postgres, which silently steals the connection instead of erroring.
      - "5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ibms}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Talks to the `db` service over the Docker network, not the host-side
      # DATABASE_URL in .env (which points at localhost:5433 for host tools).
      DATABASE_URL: postgresql://${POSTGRES_USER:-ibms}:${POSTGRES_PASSWORD:-ibms}@db:5432/${POSTGRES_DB:-ibms}?schema=public
      PORT: ${PORT:-4000}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    ports:
      - "3000:3000"

volumes:
  db-data:
