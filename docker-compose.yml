services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ibms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ibms}
      POSTGRES_DB: ${POSTGRES_DB:-ibms}
    ports:
      # Host-side 5433, not 5432 — avoids clashing with a locally-installed
      # Postgres, which silently steals the connection instead of erroring.
      - "5433:5432"
    volumes:
      # Postgres 18+ images store data under a major-version subdirectory of
      # /var/lib/postgresql (not directly at .../data) — mount the parent dir.
      # See https://github.com/docker-library/postgres/pull/1259.
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ibms}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Separate instance from `db`, not just a second database on it — this one
  # is where schema/integration-test iteration happens (migrate dev, test:e2e).
  # `db` (above) only changes when you explicitly run a migrate command
  # against it; nothing here ever touches it. Once a migration is verified
  # against db-test, promote it to `db` by running `npm run db:migrate:deploy`.
  db-test:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${TEST_POSTGRES_USER:-ibms}
      POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD:-ibms}
      POSTGRES_DB: ${TEST_POSTGRES_DB:-ibms_test}
    ports:
      # Host-side 5434 — distinct from dev's 5433 and CI's 5432 so all three
      # can run at once without colliding.
      - "5434:5432"
    volumes:
      - db-test-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TEST_POSTGRES_USER:-ibms}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Talks to the `db` service over the Docker network, not the host-side
      # DATABASE_URL in .env (which points at localhost:5433 for host tools).
      DATABASE_URL: postgresql://${POSTGRES_USER:-ibms}:${POSTGRES_PASSWORD:-ibms}@db:5432/${POSTGRES_DB:-ibms}?schema=public
      PORT: ${PORT:-4000}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      # Dev-only fallbacks below, same placeholders as .env.example — this
      # compose stack has no production deployment target yet (see README),
      # so real per-environment secrets aren't wired here. Set these in .env
      # to override.
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-only-change-me-32-characters-minimum}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:-jWvaaenpb1O7k9jMlLZhRTeQFNJ1jQOFTUHtzgTHNtg=}
      PII_ENCRYPTION_KEYS: ${PII_ENCRYPTION_KEYS:-v1:DzVvLT8z/wNB6UZW2cglf0EEajI/+hjMXk8WlVfHphI=}
      PII_ENCRYPTION_ACTIVE_KEY_ID: ${PII_ENCRYPTION_ACTIVE_KEY_ID:-v1}
      ENABLE_DEV_RESET_TOKEN: ${ENABLE_DEV_RESET_TOKEN:-false}
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    ports:
      - "3000:3000"

volumes:
  db-data:
  db-test-data:
